name: dcm
help: Docker Collection Manager
version: dev

flags:
  - long: --dir
    short: -d
    arg: dir
    help: "DCM working directory (default: ~/.local/share/dcm, override with DCM_CONFIG env var)"

commands:
  - name: init
    help: Initialize DockManager directories (repos, services/config, services/volumes, services/compose)
    alias: i

  - name: repo
    help: Manage git repositories
    alias: [r, rep]

    commands:
      - name: install
        help: Install a repository from the catalog
        alias: add
        args:
          - name: name
            required: true
            help: "Repository name from the catalog (e.g. DCMBase or official/DCMBase)"

      - name: rm
        help: Remove a repository from the repos directory
        alias: d*
        args:
          - name: name
            required: true
            help: Name of the repository to remove

      - name: register
        help: Register a repository URL in sources.local and install it
        alias: reg
        args:
          - name: url
            required: true
            help: Git repository URL
        flags:
          - long: --branch
            short: -b
            arg: branch
            help: Branch to track

      - name: list
        help: List installed repositories (--all to show all available)
        alias: [ls, l]
        flags:
          - long: --all
            short: -a
            help: Show all repositories available in sources (installed + catalog)

      - name: info
        help: Show details about a repository
        alias: [show, i*]
        args:
          - name: name
            required: true
            help: Repository name

      - name: update
        help: Fetch manifests from all sources and refresh the local index

      - name: pull
        help: git pull on installed repositories
        alias: u*
        args:
          - name: repos
            required: false
            repeatable: true
            help: Repository names to pull (pulls all if not specified)

      - name: add-source
        help: Add an external source file to sources.d/
        args:
          - name: url
            required: true
            help: URL of the source file to download

  - name: service
    help: Manage docker services
    alias: s*
    commands:
      - name: enable
        help: Enable services interactively or by name
        alias: e*
        args:
          - name: services
            required: false
            repeatable: true
            help: Service names to enable directly (e.g. Repo/Service)
        flags:
          - long: --all
            short: -a
            help: Prompt for all services including already-enabled ones
          - long: --yes
            short: -y
            help: Non-interactive — enable all disabled services without prompting

      - name: disable
        help: Disable services by removing them from services/compose/services.yml
        alias: dis*
        args:
          - name: services
            required: false
            repeatable: true
            help: Service names in format RepoName/ServiceName (e.g., Base/Caddy) to disable.
        flags:
          - long: --all
            short: -a
            help: Disable all currently enabled services

      - name: config
        help: Configure services by executing their config.sh scripts and merging to services/config/config.env
        alias: c*
        args:
          - name: services
            required: false
            repeatable: true
            help: Service names in format RepoName/ServiceName (e.g., Base/Postgres). If not specified, configures all enabled services.

      - name: status
        help: Show status of services in tabular format
        alias: s*
        flags:
          - long: --all
            short: -a
            help: Show all services including disabled ones

      - name: up
        help: Start all or specific services
        alias: u*
        args:
          - name: services
            required: false
            repeatable: true
            help: Docker service names to start (starts all if not specified)
        flags:
          - long: --build
            short: -b
            help: Rebuild images before starting (only affects services with a Dockerfile)

      - name: down
        alias: d*
        help: Stop all or specific services
        args:
          - name: services
            required: false
            repeatable: true
            help: Docker service names to stop (stops all if not specified)

      - name: restart
        alias: r*
        help: Restart all or specific services
        args:
          - name: services
            required: false
            repeatable: true
            help: Docker service names to restart (restarts all if not specified)
        flags:
          - long: --recreate
            short: -r
            help: Force container recreation (re-reads volumes, env, network config)

      - name: logs
        alias: l*
        help: Follow logs for specific services
        args:
          - name: services
            required: true
            repeatable: true
            help: Docker service names to show logs for

      - name: shell
        help: Open bash shell in container
        alias: sh*
        args:
          - name: container
            required: true
            help: Container name to open shell in

  - name: caddy
    help: Manage Caddy reverse proxy configuration
    alias: [c, ca]

    commands:
      - name: add
        help: Add or update a user snippet in Caddyfile.Before or Caddyfile.After
        alias: a*
        args:
          - name: name
            required: true
            help: Name/label for the snippet (used in BEGIN/END markers)
        flags:
          - long: --file
            short: -f
            arg: file
            help: Read snippet from file instead of opening editor
          - long: --target
            short: -t
            arg: target
            help: "Target file: before or after (default: prompt)"

      - name: service-add
        help: Add or update a user-defined route snippet in Caddyfile.Services
        alias: sa*
        args:
          - name: name
            required: true
            help: Name/label for the route snippet (used in BEGIN/END markers)
        flags:
          - long: --file
            short: -f
            arg: file
            help: Read snippet from file instead of opening editor

      - name: reverse-proxy
        alias: rp
        help: Add a reverse proxy route to Caddyfile.Before or Caddyfile.After
        args:
          - name: domain
            required: true
            help: Domain to serve (e.g. app.example.com)
          - name: target
            required: true
            help: Upstream target (e.g. localhost:8080 or container:3000)
        flags:
          - long: --target
            short: -t
            arg: target
            help: "Target file: after (default) or before"

  - name: run
    help: Run a command provided by a repo
    args:
      - name: repo
        required: true
        help: Repository name (must exist in repos/)
      - name: command
        required: false
        help: Command to run (filename without .sh extension)
      - name: args
        required: false
        repeatable: true
        help: Arguments to pass to the command
    flags:
      - long: --list
        short: -l
        help: List available commands for the repo

  - name: completion
    help: Output shell completion script for bash or zsh
    alias: comp
    args:
      - name: shell
        required: false
        help: "Shell type: bash or zsh (default: auto-detect from $SHELL)"
    flags:
      - long: --install
        short: -i
        help: Install the completion script to the appropriate directory

  - name: self-update
    help: Update dcm to the latest released version
    alias: su
