name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bashly
        run: sudo gem install bashly

      - name: Generate dcm executable
        run: |
          bashly generate
          chmod +x dcm

      - name: Create services archive
        run: tar -czf services.tgz services/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dcm
            services.tgz
